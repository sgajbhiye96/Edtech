services:
  - type: web
    name: edtech-backend
    runtime: python
    rootDir: edtech-backend
    buildCommand: 
      apt-get update && apt-get install -y \
        libjpeg-dev zlib1g-dev libtiff5-dev libfreetype6-dev \
        liblcms2-dev libwebp-dev tcl8.6-dev tk8.6-dev &&  pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn backend.wsgi:application
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  - type: web
    name: edtech-frontend
    runtime: node
    rootDir: edtech-frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npx serve -s build
    envVars:
      - key: REACT_APP_API_URL
        sync: false