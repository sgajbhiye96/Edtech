services:
  - type: web
    name: edtech-backend
    runtime: python
    rootDir: edtech-backend
    buildCommand: 
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate

    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  - type: web
    name: edtech-frontend
    runtime: node
    rootDir: edtech-frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npx serve -s build
    envVars:
      - key: REACT_APP_API_URL
        sync: false