- type: web
  name: edtech-backend
  runtime: python
  rootDir: edtech-backend
  buildCommand: |
    pip install --upgrade pip
    pip install -r requirements.txt
    python manage.py collectstatic --noinput
    python manage.py migrate
  startCommand: cd edtech-backend && gunicorn backend.wsgi:application
  envVars:
    - key: PYTHON_VERSION
      value: 3.10.12

    - key: SECRET_KEY
      sync: false

    - key: DEBUG
      value: "False"

    # ✅ MUST BE ADDED → Django won't work without this
    - key: ALLOWED_HOSTS
      value: "your-backend-service.onrender.com"

    # ✅ Aiven MySQL
    - key: DB_NAME
      sync: false
    - key: DB_USER
      sync: false
    - key: DB_PASSWORD
      sync: false
    - key: DB_HOST
      sync: false
    - key: DB_PORT
      sync: false

    # ✅ REQUIRED for Aiven (ssl-mode=REQUIRED)
    - key: DB_SSL
      value: "True"

    # ✅ Cloudinary
    - key: CLOUDINARY_URL
      sync: false

    # ✅ CORS / CSRF (your domain)
    - key: CORS_ALLOWED_ORIGINS
      sync: false
    - key: CSRF_TRUSTED_ORIGINS
      sync: false