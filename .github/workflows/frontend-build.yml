name: Frontend build

on:
  push:
    branches:
      - feature/live-cohort-phase1
  pull_request:
    branches:
      - feature/live-cohort-phase1

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edtech-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: edtech-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
